# Fork-tester / workflow_dispatch Windows installer.
# Official nightlies still come from nightly.yml + updater signing secrets.
# This job produces an unsigned-Authenticode NSIS setup (SmartScreen will warn)
# so a fork can ship a build of unreleased fixes without upstream secrets.
name: Windows sideload installer

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-nsis:
    name: Build Windows NSIS (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-sideload-x86_64

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install frontend dependencies
        shell: bash
        run: cd src/ui && bun install --frozen-lockfile

      - name: Generate icons
        shell: bash
        run: npx @tauri-apps/cli icon assets/logo.png

      - name: Build and stage CLI sidecar
        shell: bash
        run: scripts/stage-cli-sidecar.sh x86_64-pc-windows-msvc

      # Upstream tauri.conf.json has createUpdaterArtifacts=true and a public
      # updater key. Forks do not have TAURI_SIGNING_PRIVATE_KEY, so disable
      # updater artifacts. NSIS itself does not need that key.
      - name: Build desktop exe and NSIS installer
        shell: bash
        run: |
          npx --yes @tauri-apps/cli@^2.9 build --verbose \
            --target x86_64-pc-windows-msvc \
            --bundles nsis \
            --features tauri/custom-protocol,alternative-backends \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN="target/x86_64-pc-windows-msvc/release/claudette-app.exe"
          CLI="src-tauri/binaries/claudette-x86_64-pc-windows-msvc.exe"
          cp "$BIN" dist/claudette-app.exe
          cp "$CLI" dist/claudette.exe
          powershell -NoProfile -Command "Compress-Archive -Path 'dist/claudette-app.exe','dist/claudette.exe' -DestinationPath 'dist/claudette-windows-x86_64.zip' -Force"
          NSIS_DIR="target/x86_64-pc-windows-msvc/release/bundle/nsis"
          INSTALLER="$(find "$NSIS_DIR" -maxdepth 1 -name '*setup.exe' -print -quit)"
          if [ -z "$INSTALLER" ]; then
            echo "::error::No NSIS setup.exe in $NSIS_DIR"
            ls -la "$NSIS_DIR" || true
            exit 1
          fi
          cp "$INSTALLER" dist/Claudette-windows-x86_64-setup.exe

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: claudette-windows-x86_64
          path: |
            dist/Claudette-windows-x86_64-setup.exe
            dist/claudette-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
